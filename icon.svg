<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#5a0d12"/><stop offset=".55" stop-color="#2a0609"/><stop offset="1" stop-color="#120305"/></radialGradient>
    <linearGradient id="streak" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff2b2b" stop-opacity="0"/><stop offset=".5" stop-color="#ff2b2b" stop-opacity=".35"/><stop offset="1" stop-color="#ff2b2b" stop-opacity="0"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a52"/><stop offset=".55" stop-color="#e3121b"/><stop offset="1" stop-color="#9c0610"/></linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9bec8"/></linearGradient>
    <radialGradient id="btn" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c8ccd4"/></radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".55"/></filter>
    <clipPath id="ball"><circle cx="256" cy="262" r="128"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <path d="M-40 430 L560 120 L560 190 L-40 500 Z" fill="url(#streak)"/>
  <!-- cadre de scan -->
  <g fill="none" stroke="#ff2a2a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M104 178 V130 a26 26 0 0 1 26 -26 H178"/>
    <path d="M334 104 H382 a26 26 0 0 1 26 26 V178"/>
    <path d="M408 334 V382 a26 26 0 0 1 -26 26 H334"/>
    <path d="M178 408 H130 a26 26 0 0 1 -26 -26 V334"/>
  </g>
  <!-- Poké Ball -->
  <g filter="url(#shadow)">
    <g clip-path="url(#ball)">
      <rect x="120" y="126" width="272" height="136" fill="url(#red)"/>
      <rect x="120" y="262" width="272" height="136" fill="url(#white)"/>
      <rect x="120" y="248" width="272" height="28" fill="#141418"/>
      <ellipse cx="206" cy="182" rx="46" ry="26" fill="#ffffff" opacity=".35" transform="rotate(-28 206 182)"/>
    </g>
    <circle cx="256" cy="262" r="128" fill="none" stroke="#141418" stroke-width="12"/>
    <circle cx="256" cy="262" r="42" fill="#141418"/>
    <circle cx="256" cy="262" r="29" fill="url(#btn)"/>
    <circle cx="256" cy="262" r="16" fill="none" stroke="#9aa0ab" stroke-width="3"/>
  </g>
</svg>
