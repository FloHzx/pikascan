name: Relevé quotidien des prix
on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC, après la mise à jour Cardmarket de la nuit
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/snapshot.mjs
      - name: Enregistrer le relevé
        run: |
          git config user.name "pikascan-bot"
          git config user.email "pikascan-bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || (git commit -m "Relevé des prix $(date -u +%F)" && git push)
